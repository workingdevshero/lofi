  <style>
    :root { --plum:#2d1941; --plum-2:#3d2456; --gold:#e6c35c; --cream:#f5f0e8; --muted:#cbb8d9; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--plum); color:var(--cream); line-height:1.45; }
    header { padding:2.5rem 1.5rem 1.25rem; max-width:1100px; margin:0 auto; }
    h1 { font-size:1.8rem; margin:0 0 .4rem; }
    .sub { color:var(--muted); max-width:48rem; }
    h2 { max-width:1100px; margin:2rem auto .75rem; padding:0 1.5rem; font-size:1.15rem; color:var(--gold); letter-spacing:.04em; text-transform:uppercase; }
    .note { max-width:1100px; margin:0 auto 1.5rem; padding:0 1.5rem; color:var(--muted); font-size:.92rem; }
    .row, .scenes { display:grid; gap:1rem; max-width:1100px; margin:0 auto 2rem; padding:0 1.5rem; }
    .row { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .row .card img { aspect-ratio: 1; object-fit: cover; }
    .scenes { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

    .card { background:var(--plum-2); border-radius:14px; overflow:visible; border:1px solid #5a3a78; }
    .scenes .card { width:100%; margin:0; }
    .card img, .card video { border-radius:14px 14px 0 0; }
    .card img { width:100%; display:block; background:#1a0f26; }
    .scenes .card img { aspect-ratio:16/9; object-fit:cover; }
    .scenes .card video { width:100%; display:block; aspect-ratio:16/9; object-fit:contain; background:#1a0f26; }
    body[data-aspect="9"] .scenes { grid-template-columns: repeat(auto-fit, minmax(200px, 280px)); justify-content: center; }
    body[data-aspect="9"] .scenes .card video { aspect-ratio:9/16; max-height:72vh; }
    .switch { display:inline-flex; gap:.35rem; margin-top:.6rem; }
    .switch button { font:inherit; color:var(--cream); background:transparent; border:1px solid #5a3a78; border-radius:999px; padding:.35rem .9rem; cursor:pointer; }
    .switch button[aria-pressed="true"] { background:var(--gold); color:var(--plum); border-color:var(--gold); font-weight:700; }
    figcaption { padding:.7rem .85rem .9rem; font-size:.85rem; position:relative; }
    .cap-head { display:flex; align-items:flex-start; gap:.45rem; }
    .tips { position:static; flex:none; display:flex; gap:.28rem; }
    .tip { width:1.45rem; height:1.45rem; border-radius:999px; border:1px solid #5a3a78; background:var(--plum); color:var(--gold); cursor:help; padding:0; display:grid; place-items:center; }
    .tip svg { width:.82rem; height:.82rem; display:block; }
    .prompt { display:none; position:absolute; left:0; top:calc(100% + .35rem); width:min(32rem, 80vw); padding:.75rem .85rem; background:#1a0f26; color:var(--cream); border:1px solid var(--gold); border-radius:10px; font-size:.78rem; line-height:1.45; z-index:20; white-space:pre-wrap; box-shadow:0 12px 32px rgba(0,0,0,.45); }
    .prompt.show { display:block; }
    .who { font-weight:700; flex:1; min-width:0; }
    .meta { color:var(--muted); font-size:.78rem; margin-top:.2rem; }
    audio { width:100%; margin-top:.5rem; }
    a { color:var(--gold); }
  </style>

  <script>
    const buttons = document.querySelectorAll(".switch button");
    function applyAspect(aspect) {
      document.body.dataset.aspect = aspect;
      localStorage.setItem("hl-aspect", aspect);
      buttons.forEach((b) => b.setAttribute("aria-pressed", b.dataset.aspect === aspect ? "true" : "false"));
      document.querySelectorAll("video[data-src-16]").forEach((video) => {
        const next = video.getAttribute(aspect === "9" ? "data-src-9" : "data-src-16");
        if (video.getAttribute("src") === next) return;
        video.src = next;
        video.load();
        video.play().catch(() => {});
      });
    }
    buttons.forEach((b) => b.addEventListener("click", () => applyAspect(b.dataset.aspect)));
    applyAspect(localStorage.getItem("hl-aspect") === "9" ? "9" : "16");

    const photoIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.5" fill="currentColor"/><path d="M4 16.5l4.5-3.5 3.2 2.4 2.6-2 5.2 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
    const noteIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V7.2l9-2v8.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.2" cy="17.5" r="2.1" fill="currentColor"/><circle cx="16.2" cy="13.6" r="2.1" fill="currentColor"/></svg>';
    document.querySelectorAll(".scenes > .card").forEach((card, i) => {
      const cap = card.querySelector("figcaption");
      const tips = document.createElement("div");
      tips.className = "tips";
      const add = (label, icon, text) => {
        if (!text) return;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tip";
        btn.innerHTML = icon;
        btn.setAttribute("aria-label", label);
        const tip = document.createElement("span");
        tip.className = "prompt";
        tip.setAttribute("role", "tooltip");
        tip.textContent = text;
        const place = () => {
          tip.style.left = "0px";
          tip.style.right = "auto";
          const box = tip.getBoundingClientRect();
          const pad = 12;
          if (box.right > window.innerWidth - pad) {
            tip.style.left = `${window.innerWidth - pad - box.width - cap.getBoundingClientRect().left}px`;
          }
          if (tip.getBoundingClientRect().left < pad) tip.style.left = `${pad - cap.getBoundingClientRect().left}px`;
        };
        const show = () => {
          cap.querySelectorAll(".prompt.show").forEach((el) => { if (el !== tip) el.classList.remove("show"); });
          tip.classList.add("show");
          requestAnimationFrame(place);
        };
        const hide = (e) => {
          const next = e.relatedTarget;
          if (next === btn || next === tip || (next && tip.contains(next))) return;
          tip.classList.remove("show");
        };
        btn.addEventListener("mouseenter", show);
        btn.addEventListener("focus", show);
        btn.addEventListener("mouseleave", hide);
        btn.addEventListener("blur", () => tip.classList.remove("show"));
        tip.addEventListener("mouseleave", hide);
        tips.append(btn);
        cap.append(tip);
      };
      add("Picture prompt", photoIcon, scenePrompts[i]);
      add("Music prompt", noteIcon, musicPrompts[i]);
      const head = document.createElement("div");
      head.className = "cap-head";
      const who = cap.querySelector(".who");
      who.before(head);
      head.append(who, tips);
    });
  </script>
