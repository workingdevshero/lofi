<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heroic LoFi for Vibe Coding</title>
  <style>
    :root { --plum:#2d1941; --plum-2:#3d2456; --gold:#e6c35c; --cream:#f5f0e8; --muted:#cbb8d9; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--plum); color:var(--cream); line-height:1.45; }
    header { padding:2.5rem 1.5rem 1.25rem; max-width:1100px; margin:0 auto; }
    h1 { font-size:1.8rem; margin:0 0 .4rem; }
    .sub { color:var(--muted); max-width:48rem; }
    h2 { max-width:1100px; margin:2rem auto .75rem; padding:0 1.5rem; font-size:1.15rem; color:var(--gold); letter-spacing:.04em; text-transform:uppercase; }
    .note { max-width:1100px; margin:0 auto 1.5rem; padding:0 1.5rem; color:var(--muted); font-size:.92rem; }
    .row, .scenes { display:grid; gap:1rem; max-width:1100px; margin:0 auto 2rem; padding:0 1.5rem; }
    .row { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .row .card img { aspect-ratio: 1; object-fit: cover; }
    .scenes { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

    .card { background:var(--plum-2); border-radius:14px; overflow:visible; border:1px solid #5a3a78; }
    .card img, .card video { border-radius:14px 14px 0 0; }
    .card img { width:100%; display:block; background:#1a0f26; }
    .scenes .card img { aspect-ratio:16/9; object-fit:cover; }
    .scenes .card video { width:100%; display:block; aspect-ratio:16/9; object-fit:contain; background:#1a0f26; }
    body[data-aspect="9"] .scenes { grid-template-columns: repeat(auto-fit, minmax(200px, 280px)); justify-content: center; }
    body[data-aspect="9"] .scenes .card video { aspect-ratio:9/16; max-height:72vh; }
    .switch { display:inline-flex; gap:.35rem; margin-top:.6rem; }
    .switch button { font:inherit; color:var(--cream); background:transparent; border:1px solid #5a3a78; border-radius:999px; padding:.35rem .9rem; cursor:pointer; }
    .switch button[aria-pressed="true"] { background:var(--gold); color:var(--plum); border-color:var(--gold); font-weight:700; }
    figcaption { padding:.7rem .85rem .9rem; font-size:.85rem; position:relative; }
    .info { position:absolute; top:.55rem; right:.55rem; width:1.35rem; height:1.35rem; border-radius:999px; border:1px solid #5a3a78; background:var(--plum); color:var(--gold); font:700 .75rem/1.35rem ui-sans-serif, system-ui, sans-serif; cursor:help; padding:0; }
    .prompt { display:none; position:absolute; left:0; top:calc(100% + .35rem); width:min(32rem, 80vw); padding:.75rem .85rem; background:#1a0f26; color:var(--cream); border:1px solid var(--gold); border-radius:10px; font-size:.78rem; line-height:1.45; z-index:20; white-space:pre-wrap; box-shadow:0 12px 32px rgba(0,0,0,.45); }
    .info:hover + .prompt, .info:focus + .prompt { display:block; }
    .who { font-weight:700; }
    .meta { color:var(--muted); font-size:.78rem; margin-top:.2rem; }
    audio { width:100%; margin-top:.5rem; }
    a { color:var(--gold); }
  </style>
</head>
<body>

    <span class="switch" role="group" aria-label="Preview shape">
      <button type="button" data-aspect="16" aria-pressed="true">16:9</button>
      <button type="button" data-aspect="9" aria-pressed="false">9:16</button>
    </span>
  </header>

  <script>
    const buttons = document.querySelectorAll(".switch button");
    function applyAspect(aspect) {
      document.body.dataset.aspect = aspect;
      localStorage.setItem("hl-aspect", aspect);
      buttons.forEach((b) => b.setAttribute("aria-pressed", b.dataset.aspect === aspect ? "true" : "false"));
      document.querySelectorAll("video[data-src-16]").forEach((video) => {
        const next = video.getAttribute(aspect === "9" ? "data-src-9" : "data-src-16");
        if (video.getAttribute("src") === next) return;
        video.src = next;
        video.load();
        video.play().catch(() => {});
      });
    }
    buttons.forEach((b) => b.addEventListener("click", () => applyAspect(b.dataset.aspect)));
    applyAspect(localStorage.getItem("hl-aspect") === "9" ? "9" : "16");

    const scenePrompts = [
      "Flat modern 2D vector illustration of an empty moonlit rooftop ledge. Full cream moon, plum night sky with a few stars, dark city silhouettes with warm yellow windows. Same flat 2D vector illustration. No people, no animals, no characters, no laptop, no text.",
      "Flat modern 2D vector illustration of an empty city rooftop at night. A gold closed-lid laptop and a steaming coffee mug sit alone on a concrete parapet. Full cream moon, deep plum sky, dark buildings with warm yellow windows. Quiet and cozy. Smooth gradients, clean geometric shapes. No people, no animals, no characters, no readable text.",
      "Flat modern 2D vector illustration of an empty city rooftop at golden hour. Low amber sun, long shadows across a concrete parapet, warm gold light on dark buildings. Deep orange sky fading to plum. Empty ledge, no people. Clean geometric silhouettes, smooth gradients, quiet. No animals, no text.",
      "Flat modern 2D vector illustration looking out from a high rooftop balcony over a dense city at night. Many buildings packed with warm yellow windows, some still dark, like a skyline booting up. Empty balcony parapet in the foreground with plenty of standing room for two people. Cream moon, deep plum sky. The city lights are the subject. Clean geometric shapes, smooth gradients. No people, no animals, no laptop, no text.",
      "Flat modern 2D vector illustration of an empty city rooftop at late dusk. A low orange-amber sunset band on the horizon, deep plum sky above, a pale not-yet-full moon. Dark building silhouettes, most windows still dark. Empty concrete parapet ledge in the foreground on the right. Smooth gradients, clean geometric shapes, quiet and cinematic. No people, no animals, no characters, no text.",
      "Flat modern 2D vector illustration of an empty underground high-tech workshop. Curved dark plum walls, a wooden workbench, a wall of ultrawide monitors showing abstract gold code-like glow (no readable letters), server racks with tiny amber LEDs, a steaming mug on the bench. Cozy subterranean night. Smooth gradients, clean shapes. No people, no animals, no characters, no readable text.",
      "Flat modern 2D vector illustration of a city rooftop corner at night. A round water tower stands in the background on the left, not filling the frame. In the foreground, a wide empty concrete parapet ledge with plenty of sitting room for a person and a small creature facing each other. Huge cream moon, deep plum sky, a few warm yellow windows on distant buildings. Intimate conversation spot, but the ledge is large and uncluttered. Clean geometric shapes, smooth gradients. No people, no animals, no pillows, no mugs, no text, no laptop.",
      "Paint a new background in the same soft illustrated style as the rainy street and the ledge plates. A large glass bus shelter seen straight on and centered, with one wide bench big enough for two people to sit. Behind it, simple plum buildings and a glowing cream moon. Rain and a wet sidewalk. No street receding into the distance. No people, no text.",
      "Flat modern 2D vector illustration of a tall clock-tower loft interior at night. A large arched window shows a plum city and cream moon. An empty wooden chair and a small backpack-sized gold laptop sit on the wide windowsill. Cathedral-like tall window, quiet focus. Room to sit. Clean geometric shapes, deep plum walls. No people, no animals, no logos, no readable text.",
      "Flat modern 2D vector illustration of an empty city rooftop at night. A gold laptop on the parapet shows a split screen of two abstract glowing panels, one slightly red-amber and one gold, no readable letters. Full cream moon, plum sky. Quiet tension. Clean geometric 2D vector. No people, no animals, no characters, no text.",
      "Flat modern 2D vector illustration of a metal water-tower catwalk high above a city at night. Empty railing to lean on, city stretching to the horizon, cream moon. A tiny closed gold laptop sits ignored on the grate behind the railing. The view is the point. Plenty of standing room on the catwalk. Deep plum sky, clean geometric shapes. No people, no animals, no logos, no text.",
      "Flat modern 2D vector illustration of an empty brick alley at night with a fire-escape landing. One purple-pink neon sign with no readable letters, wet pavement, deep plum shadows. Quiet and a little melancholy. Clean geometric shapes, smooth gradients. No people, no animals, no characters, no text.",
      "Flat modern 2D vector illustration of an empty wet city street at night under a single sodium-orange streetlamp. Dark wet asphalt reflections, a few warm windows, deep plum sky. Quiet hotfix atmosphere. Clean geometric buildings, smooth gradients. No people, no animals, no cars with drivers, no characters, no text.",
      "Flat modern 2D vector illustration of a very dark empty underground workshop. Most monitors off, one screen showing a single blinking gold cursor, an empty chair, faint server LEDs. Deep plum shadows, quiet on-call atmosphere. Clean geometric 2D vector. No people, no animals, no characters, no readable text.",
      "Flat modern 2D vector illustration of an empty city rooftop wrapped in low night fog. Full cream moon glowing through the mist, dark parapet, blurred gold windows. Quiet, soft, atmospheric. Clean geometric shapes, smooth gradients, plum and navy. No people, no animals, no characters, no text.",
      "Keep this moonlit rooftop. The sunglasses man in the black trench sits on the ledge with a gold laptop showing a small terminal. The small red robotic lobster in a tiny plum cape peers at the screen, lightbulb bright. No main superhero in this shot. Same flat 2D rooftop style, no sticker outlines. Playful after-hours side quest.",
      "Flat modern 2D vector illustration of a city rooftop at night under a small glass canopy. Rain on the glass. A small desk with a gold laptop sits under the canopy, occupying only the lower-right third. Large empty rooftop ledge and plum night sky with a cream moon on the left, so people could stand beside the desk. Clean geometric buildings with warm yellow windows. No people, no animals, no logos, no readable text.",
      "Flat modern 2D vector illustration of a rooftop stairwell door slightly open at night. Warm gold interior light spills onto the roof from the doorway. A small backpack-sized gold laptop sits on the last concrete step. Empty landing with room for someone to sit. Quiet almost-done atmosphere, plum night sky. Clean geometric shapes. No people, no animals, no logos, no text.",
      "Flat modern 2D vector illustration of an empty city rooftop at night. A gold laptop on the parapet glows a soft green-gold, reflecting on the ledge. Full cream moon, deep plum sky, dark buildings. Calm success atmosphere, not a party. Clean geometric shapes. No people, no animals, no characters, no readable text.",
      "Keep this exact flat 2D vector style, simple building silhouettes, cream moon, and empty dark parapet on the right. Change only the sky to dawn: deep plum at the top fading into amber and rose along the horizon. City windows a little dimmer. Place a small closed gold laptop on the right parapet, backpack-sized, plain lid no logo. No people, no text. Same simple shapes as this midnight scene."
    ];
    document.querySelectorAll(".scenes > .card").forEach((card, i) => {
      const prompt = scenePrompts[i];
      if (!prompt) return;
      const cap = card.querySelector("figcaption");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "info";
      btn.textContent = "i";
      btn.setAttribute("aria-label", "Scene prompt");
      const tip = document.createElement("span");
      tip.className = "prompt";
      tip.setAttribute("role", "tooltip");
      tip.textContent = prompt;
      cap.append(btn, tip);
      const place = () => {
        tip.style.left = "0px";
        tip.style.right = "auto";
        const box = tip.getBoundingClientRect();
        const pad = 12;
        if (box.right > window.innerWidth - pad) {
          tip.style.left = `${window.innerWidth - pad - box.width - cap.getBoundingClientRect().left}px`;
        }
        if (tip.getBoundingClientRect().left < pad) tip.style.left = `${pad - cap.getBoundingClientRect().left}px`;
      };
      btn.addEventListener("mouseenter", () => requestAnimationFrame(place));
      btn.addEventListener("focus", () => requestAnimationFrame(place));
    });
  </script>
